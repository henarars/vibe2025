<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
        .edit-input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item" disabled>
    <button onclick="addItem()" disabled>Add</button>
</div>

<script>
    async function startEdit(id, currentText) {
        const row = document.querySelector(`tr[data-id="${id}"]`);
        if (!row) return;

        row.innerHTML = `
            <td>${id}</td>
            <td><input type="text" class="edit-input" value="${currentText}" id="edit-${id}"></td>
            <td>
                <button onclick="saveEdit(${id})">Save</button>
                <button onclick="cancelEdit(${id}, '${currentText}')">Cancel</button>
            </td>
        `;
    }

    async function saveEdit(id) {
        const newText = document.getElementById(`edit-${id}`).value.trim();
        if (!newText) return;

        try {
            const response = await fetch(`/update/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: newText })
            });
            
            if (response.ok) {
                window.location.reload();
            } else {
                console.error('Failed to update item');
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    function cancelEdit(id, originalText) {
        const row = document.querySelector(`tr[data-id="${id}"]`);
        if (!row) return;

        row.innerHTML = `
            <td>${id}</td>
            <td>${originalText}</td>
            <td><button onclick="startEdit(${id}, '${originalText}')">Edit</button></td>
        `;
    }
</script>

</body>
</html>
